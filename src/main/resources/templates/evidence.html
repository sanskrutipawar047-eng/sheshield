<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evidence Vault - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4" style="max-width:1000px">
    <h3><i class="bi bi-safe2-fill"></i> Evidence Vault</h3>
    <p class="text-muted">Every file is encrypted with AES-GCM and its SHA-256 hash is saved. If anyone changes the file, verification fails.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card p-4 mb-4">
        <form th:action="@{/evidence/upload}" method="post" enctype="multipart/form-data" class="row g-2">
            <div class="col-md-9"><input class="form-control" type="file" name="file" required></div>
            <div class="col-md-3"><button class="btn btn-dark w-100"><i class="bi bi-lock-fill"></i> Encrypt &amp; Save</button></div>
        </form>
        <small class="text-muted mt-2">Audio, video or image. Maximum 20 MB.</small>
    </div>

    <table class="table table-bordered align-middle">
        <thead class="table-dark"><tr><th>File</th><th>Type</th><th>SHA-256</th><th>Saved on</th><th>Integrity</th></tr></thead>
        <tbody>
            <tr th:each="f : ${files}">
                <td th:text="${f.originalFileName}">file</td>
                <td th:text="${f.fileType}">type</td>
                <td class="hash" th:text="${#strings.abbreviate(f.sha256Hash, 20)}" th:title="${f.sha256Hash}">hash</td>
                <td th:text="${#temporals.format(f.capturedAt, 'dd MMM yyyy, HH:mm')}">time</td>
                <td>
                    <form th:action="@{/evidence/verify/{id}(id=${f.evidenceId})}" method="post">
                        <button class="btn btn-sm btn-outline-light"><i class="bi bi-shield-check"></i> Verify</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(files)}"><td colspan="5" class="text-center">Vault is empty.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
