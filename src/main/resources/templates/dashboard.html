<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container text-center mt-4" style="max-width:900px">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <h3>Hello, <span th:text="${session.userName}">User</span> 👋</h3>
    <p class="text-muted">You are protected. Help is one tap away.</p>

    <!-- Big pulsing SOS button -->
    <div class="sos-wrap">
        <a th:href="@{/simulate}" class="btn sos-btn d-flex align-items-center justify-content-center">SOS</a>
    </div>
    <p class="text-muted mb-4">Tap SOS to open the danger simulator</p>

    <!-- Quick action tiles -->
    <!-- Quick action tiles -->
<div class="row g-3 mb-5">
    <div class="col-6 col-md-4"><a class="tile" th:href="@{/simulate}"><i class="bi bi-activity text-danger"></i>Simulate Danger</a></div>
    <div class="col-6 col-md-4"><a class="tile" th:href="@{/contacts}"><i class="bi bi-people-fill" style="color:#7f5af0"></i>Trusted Contacts</a></div>
    <div class="col-6 col-md-4"><a class="tile" th:href="@{/trips}"><i class="bi bi-signpost-split-fill text-success"></i>Trip Sharing</a></div>
    <div class="col-6 col-md-4"><a class="tile" th:href="@{/evidence}"><i class="bi bi-safe2-fill text-info"></i>Evidence Vault</a></div>
    <div class="col-6 col-md-4"><a class="tile" th:href="@{/reports}"><i class="bi bi-megaphone-fill" style="color:#e45aa7"></i>Safety Reports</a></div>
    <div class="col-6 col-md-4"><a class="tile" th:href="@{/risk-zones}"><i class="bi bi-geo-alt-fill text-warning"></i>Risk Zones</a></div>
</div>
