<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="row align-items-center" style="min-height:100vh">
        <div class="col-lg-7 mb-4">
            <h1 class="hero-title"><i class="bi bi-shield-heart-fill"></i> SheShield</h1>
            <p class="fs-5 text-muted">An AI-powered safety system that doesn't wait for a woman to ask for help.</p>
            <div>
                <span class="layer-chip"><i class="bi bi-eye"></i> Prevent</span>
                <span class="layer-chip"><i class="bi bi-activity"></i> Detect</span>
                <span class="layer-chip"><i class="bi bi-broadcast"></i> Respond</span>
                <span class="layer-chip"><i class="bi bi-heart"></i> Support</span>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card p-4">
                <h3 class="mb-3">Welcome back</h3>
                <div th:replace="~{fragments/layout :: messages}"></div>
                <form th:action="@{/login}" method="post">
                    <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
                    <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
                    <button class="btn btn-dark w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Login</button>
                </form>
                <p class="mt-3 mb-0">New here? <a th:href="@{/register}">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
