<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trips - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4" style="max-width:900px">
    <h3><i class="bi bi-signpost-split-fill"></i> Trip Sharing</h3>
    <p class="text-muted">Start a trip so your trusted contacts can follow your journey.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card p-4 mb-4">
        <form th:action="@{/trips/start}" method="post" class="row g-2">
            <div class="col-md-9"><input class="form-control" name="destination" placeholder="Where are you going? (e.g. Home, College)" required></div>
            <div class="col-md-3"><button class="btn btn-dark w-100"><i class="bi bi-play-fill"></i> Start Trip</button></div>
        </form>
    </div>

    <table class="table table-bordered">
        <thead class="table-dark"><tr><th>Destination</th><th>Started</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
            <tr th:each="t : ${trips}">
                <td th:text="${t.destination}">Destination</td>
                <td th:text="${#temporals.format(t.startTime, 'dd MMM yyyy, HH:mm')}">Time</td>
                <td>
                    <span th:if="${t.status.name() == 'ACTIVE'}" class="badge bg-success"><span class="live-dot"></span>LIVE</span>
                    <span th:if="${t.status.name() == 'COMPLETED'}" class="badge bg-secondary">COMPLETED</span>
                </td>
                <td>
                    <form th:if="${t.status.name() == 'ACTIVE'}" th:action="@{/trips/end/{id}(id=${t.tripId})}" method="post">
                        <button class="btn btn-sm btn-outline-light"><i class="bi bi-stop-fill"></i> End Trip</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(trips)}"><td colspan="4" class="text-center">No trips yet.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
