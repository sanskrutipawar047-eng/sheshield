<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Risk Zones - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <h3><i class="bi bi-geo-alt-fill"></i> Risk Heatmap</h3>
    <p class="text-muted">Red = high risk, yellow = medium, green = low. Phase 2: scores will come from an ML model trained on crime data and reports.</p>

    <!-- Map -->
    <div class="card p-2 mb-4">
        <div id="map" style="height:380px; border-radius:16px;"></div>
    </div>

    <!-- Table -->
    <table class="table table-bordered align-middle">
        <thead class="table-dark"><tr><th>Area</th><th>Time</th><th>Risk Score</th><th>Level</th></tr></thead>
        <tbody>
            <tr th:each="z : ${zones}">
                <td th:text="${z.areaName}">Area</td>
                <td th:text="${z.timeBand}">Time</td>
                <td style="min-width:160px">
                    <div class="progress" style="height:10px; background:rgba(255,255,255,.15)">
                        <div class="progress-bar"
                             th:style="'width:' + ${z.riskScore} + '%'"
                             th:classappend="${z.level == 'HIGH'} ? 'bg-danger' : (${z.level == 'MEDIUM'} ? 'bg-warning' : 'bg-success')"></div>
                    </div>
                    <small th:text="${z.riskScore} + ' / 100'">0</small>
                </td>
                <td><span class="badge" th:text="${z.level}"
                          th:classappend="${z.level == 'HIGH'} ? 'bg-danger' : (${z.level == 'MEDIUM'} ? 'bg-warning text-dark' : 'bg-success')">LEVEL</span></td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    // Zones come from the server (RiskZoneDto list)
    const zones = /*[[${zones}]]*/ [];

    const colors = { HIGH: '#ff4d6d', MEDIUM: '#ffb703', LOW: '#2ec4b6' };
    const map = L.map('map').setView([18.5204, 73.8567], 13);   // Pune

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // One circle per risk zone. Bigger and redder = more dangerous.
    zones.forEach(z => {
        L.circle([z.latitude, z.longitude], {
            radius: 150 + z.riskScore * 5,
            color: colors[z.level], fillColor: colors[z.level], fillOpacity: 0.35
        }).addTo(map).bindPopup('<b>' + z.areaName + '</b><br>' + z.timeBand +
                                '<br>Risk: ' + z.riskScore + ' (' + z.level + ')');
    });

    // Show the user's own location (browser asks for permission)
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map)
                .bindPopup('You are here').openPopup();
            map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        });
    }
</script>
</body>
</html>
