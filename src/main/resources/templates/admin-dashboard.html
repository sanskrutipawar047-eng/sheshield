<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <h3><i class="bi bi-speedometer2"></i> Admin Dashboard</h3>
    <p class="text-muted">Overview of users and alerts. False-alarm labels will train the ML model in Phase 2.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-people-fill" style="color:#7f5af0"></i>
            <div class="num" th:text="${stats.totalUsers}">0</div><small class="text-muted">Total Users</small></div></div>
        <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-bell-fill text-warning"></i>
            <div class="num" th:text="${stats.totalAlerts}">0</div><small class="text-muted">Total Alerts</small></div></div>
        <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-broadcast text-danger"></i>
            <div class="num" th:text="${stats.sentAlerts}">0</div><small class="text-muted">SOS Sent</small></div></div>
        <div class="col-6 col-md-3"><div class="stat"><i class="bi bi-x-octagon-fill text-info"></i>
            <div class="num" th:text="${stats.falseAlarms}">0</div><small class="text-muted">False Alarms</small></div></div>
    </div>

    <h5>Recent Alerts</h5>
    <table class="table table-bordered align-middle">
        <thead class="table-dark">
            <tr><th>#</th><th>User</th><th>Score</th><th>Level</th><th>Status</th><th>False alarm?</th><th>Time</th></tr>
        </thead>
        <tbody>
            <tr th:each="a : ${alerts}">
                <td th:text="${a.alertId}">1</td>
                <td th:text="${a.userName}">User</td>
                <td th:text="${#numbers.formatDecimal(a.dangerScore, 1, 0)}">0</td>
                <td><span class="badge" th:text="${a.alertLevel}"
                          th:classappend="${a.alertLevel.name() == 'HIGH'} ? 'bg-danger' : (${a.alertLevel.name() == 'MEDIUM'} ? 'bg-warning text-dark' : 'bg-success')">LEVEL</span></td>
                <td th:text="${a.status}">STATUS</td>
                <td th:text="${a.falseAlarm == null} ? 'Not answered' : (${a.falseAlarm} ? 'Yes' : 'No')">-</td>
                <td th:text="${#temporals.format(a.triggeredAt, 'dd MMM, HH:mm')}">time</td>
            </tr>
            <tr th:if="${#lists.isEmpty(alerts)}"><td colspan="7" class="text-center">No alerts yet.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
