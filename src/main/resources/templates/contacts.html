<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trusted Contacts - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <h3>Trusted Contacts</h3>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <form th:action="@{/contacts/add}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input class="form-control" name="name" placeholder="Name" required></div>
        <div class="col-md-4"><input class="form-control" name="phone" placeholder="Phone (10 digits)" required></div>
        <div class="col-md-4"><button class="btn btn-dark w-100">Add Contact</button></div>
    </form>

    <table class="table table-bordered bg-white">
        <thead class="table-dark"><tr><th>Name</th><th>Phone</th><th>Action</th></tr></thead>
        <tbody>
            <tr th:each="c : ${contacts}">
                <td th:text="${c.name}">Name</td>
                <td th:text="${c.phone}">Phone</td>
                <td>
                    <form th:action="@{/contacts/delete/{id}(id=${c.contactId})}" method="post">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(contacts)}"><td colspan="3" class="text-center">No contacts yet.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
