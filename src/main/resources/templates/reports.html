<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safety Reports - SheShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <h3><i class="bi bi-megaphone-fill"></i> Community Safety Reports</h3>
    <p class="text-muted">Report an unsafe place without revealing your identity.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="row g-4">
        <!-- Report form -->
        <div class="col-lg-5">
            <div class="card p-4">
                <h5 class="mb-3">Report an unsafe place</h5>
                <form th:action="@{/reports/add}" method="post">
                    <select class="form-select mb-2" name="zoneId" required>
                        <option value="" disabled selected>Select area</option>
                        <option th:each="z : ${zones}" th:value="${z.zoneId}" th:text="${z.areaName}">Area</option>
                    </select>
                    <select class="form-select mb-2" name="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option>Poor lighting</option>
                        <option>Stalking / following</option>
                        <option>Harassment</option>
                        <option>Isolated / deserted</option>
                        <option>Other</option>
                    </select>
                    <textarea class="form-control mb-2" name="description" rows="3" placeholder="What happened? (min 10 characters)" required></textarea>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="anonymous" id="anon" checked>
                        <label class="form-check-label" for="anon">Report anonymously</label>
                    </div>
                    <button class="btn btn-dark w-100"><i class="bi bi-send-fill"></i> Submit Report</button>
                </form>
            </div>
        </div>

        <!-- Report list -->
        <div class="col-lg-7">
            <div class="card p-3">
                <h5 class="mb-3">Recent reports</h5>
                <div th:each="r : ${reports}" class="mb-3 pb-3 border-bottom border-secondary">
                    <div class="d-flex justify-content-between">
                        <strong th:text="${r.areaName}">Area</strong>
                        <span>
                            <span class="badge bg-success" th:if="${r.verified}">Verified</span>
                            <span class="badge bg-secondary" th:unless="${r.verified}">Unverified</span>
                        </span>
                    </div>
                    <span class="badge bg-warning text-dark" th:text="${r.category}">Category</span>
                    <p class="mb-1 mt-1" th:text="${r.description}">Description</p>
                    <small class="text-muted">By <span th:text="${r.reportedBy}">Anonymous</span></small>
                    <form th:if="${session.role == 'ADMIN' and !r.verified}"
                          th:action="@{/reports/verify/{id}(id=${r.reportId})}" method="post" class="mt-2">
                        <button class="btn btn-sm btn-outline-light"><i class="bi bi-patch-check"></i> Verify (admin)</button>
                    </form>
                </div>
                <p class="text-center mb-0" th:if="${#lists.isEmpty(reports)}">No reports yet.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
